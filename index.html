<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 3rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    h1 {
      font-size: 2.5rem;
      color: #16a34a;
      margin: 0;
    }

    p {
      font-size: 1.1rem;
      color: #6b7280;
      max-width: 32rem;
      margin: 0;
    }

    .details {
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 1rem 1.5rem;
      font-size: 0.9rem;
      color: #4b5563;
      text-align: left;
    }

    .details p {
      margin: 0.25rem 0;
      font-size: inherit;
      color: inherit;
    }
  </style>
</head>
<body>
  <h1>✅ It's working!</h1>
  <p>
    If you can see this page, Cloudflare is serving your static files correctly.
  </p>

  <div class="details">
    <p><strong>File:</strong> index.html</p>
    <p><strong>Loaded at:</strong> <span id="loaded-at"></span></p>
  </div>

  <script>
    document.getElementById("loaded-at").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
